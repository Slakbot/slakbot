name: Feature request
description: Suggest something SlakBot should be able to do
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: |
        Have a look at the [open requests](https://github.com/Slakbot/slakbot/issues?q=is%3Aissue+is%3Aopen+label%3Aenhancement) first. If yours is already there, a 👍 on it helps more than a new issue.
  - type: textarea
    id: problem
    attributes:
      label: What are you trying to do?
      description: Describe the problem rather than the solution, and say what you do today instead.
      placeholder: |
        I want new members to pick their own roles, but I do not want to hand them out by hand every time.
    validations:
      required: true
  - type: textarea
    id: idea
    attributes:
      label: How do you think it should work?
      description: Optional. Only if you already have a picture of it.
    validations:
      required: false
